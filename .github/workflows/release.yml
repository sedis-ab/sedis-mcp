name: Release

# Tag-triggered release: BLOCKING security+contract+smoke gate → npm publish via
# OIDC trusted publishing (auto-provenance; no steady-state npm auth token, no
# explicit provenance flag) → mcp-publisher (metadata-only MCP registry) →
# changesets GitHub Release.
#
# Trusted publisher (configured once on npmjs.com → @sedis/mcp →
# Settings → Trusted Publisher → GitHub Actions):
#   Organization: sedis-ab   Repository: sedis-mcp   Workflow: release.yml
# Bootstrap first publish is a one-time manual step (Pattern 2) — see CONTRIBUTING.md.
#
# Runner floors for OIDC trusted publishing: Node >= 22.14.0, npm >= 11.5.1.

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write # REQUIRED: mints the OIDC token npm + the MCP registry trust
  contents: write # changesets needs this to cut the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: publish (npm OIDC + MCP registry) + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22" # >= 22.14.0 for OIDC trusted publishing
          registry-url: "https://registry.npmjs.org" # MANDATORY for trusted publishing

      # OIDC trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.x, which
      # silently falls back to (empty) token auth and 404s on the publish PUT.
      # Upgrade npm BEFORE ci/publish so the tokenless OIDC flow is actually used.
      - run: npm install -g npm@latest
      - run: npm --version

      - run: npm ci
      - run: npm run build

      # BLOCKING gate — the two security suites + contract + smoke MUST pass
      # before any publish step runs. A cross-tenant leak or a key leak stops
      # the release here.
      - name: BLOCKING security + contract + smoke gate
        run: npx vitest run test/security test/contract test/smoke
        env:
          SEDIS_API_BASE_URL: ${{ secrets.SEDIS_API_BASE_URL }}
          SEDIS_API_KEY_A: ${{ secrets.SEDIS_API_KEY_A }}
          SEDIS_API_KEY_B: ${{ secrets.SEDIS_API_KEY_B }}
          B_SEDIS_ID: ${{ secrets.B_SEDIS_ID }}
          A_KNOWN_SEDIS_ID: ${{ secrets.A_KNOWN_SEDIS_ID }}

      # Build the Claude Desktop one-click bundle (.mcpb). Independent of the npm
      # publish; only runs once the BLOCKING gate above is green. esbuild +
      # @anthropic-ai/mcpb come from `npm ci` (devDependencies).
      - name: Build the Claude Desktop bundle (.mcpb)
        run: npm run build:mcpb

      # npm publish via OIDC trusted publishing.
      # No npm auth token in env, no explicit provenance flag: provenance is
      # auto-generated under OIDC; access:public comes from publishConfig.
      - name: Publish to npm (OIDC trusted publishing → auto-provenance)
        run: npm publish

      # MCP registry (metadata only) — runs after the npm package exists.
      - name: Fetch mcp-publisher CLI
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Log in to the MCP registry via GitHub OIDC (no secret)
        run: ./mcp-publisher login github-oidc
      # Stamp the real published version into server.json — its committed value is a
      # 0.0.0 placeholder, and the registry validates @sedis/mcp@<version> against npm
      # (404s on 0.0.0). Keep the placeholder in source; substitute at publish time.
      - name: Stamp the release version into server.json
        run: |
          V=$(node -p "require('./package.json').version")
          node -e "const fs=require('fs'),s=require('./server.json');s.version=process.argv[1];s.packages[0].version=process.argv[1];fs.writeFileSync('server.json',JSON.stringify(s,null,2)+'\n')" "$V"
          echo "server.json stamped to $V"
      # continue-on-error: the registry listing is metadata-only discoverability — it
      # must NEVER block the npm publish, the GitHub Release, or the .mcpb asset (which
      # all run after it). A registry hiccup should not fail the release.
      - name: Publish server.json to the MCP registry
        run: |
          for i in 1 2 3 4; do
            ./mcp-publisher publish && exit 0
            echo "registry publish attempt $i failed (the just-published npm version may still be propagating); retrying in 20s..."
            sleep 20
          done
          echo "MCP registry publish did not succeed after retries — non-fatal; it will catch up on the next release."
          exit 1
        continue-on-error: true

      # Create the GitHub Release for this tag (idempotent: edit if it already
      # exists). NOTE: the prior changesets/action createGithubReleases mode was a
      # silent no-op here, because this workflow runs `npm publish` directly rather
      # than `changeset publish` — so releases never got created. This makes it real.
      - name: Create the GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" --title "Sedis MCP ${{ github.ref_name }}" --generate-notes --latest \
            || gh release edit "${{ github.ref_name }}" --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Attach the one-click Claude Desktop bundle to the release for this tag so
      # non-technical users can download a single file. Best-effort: if the
      # release name differs from the tag it won't fail the publish (the .mcpb is
      # also kept as a workflow artifact below).
      - name: Attach the .mcpb to the GitHub Release
        run: gh release upload "${{ github.ref_name }}" dist/sedis-mcp.mcpb --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload the .mcpb as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sedis-mcp-mcpb
          path: dist/sedis-mcp.mcpb
          if-no-files-found: error
